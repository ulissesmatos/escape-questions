<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape Room - Banco de Pistas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📂 Escape Room Digital</h1>
      <p>Pesquise e responda para descobrir a resposta de cada pergunta!</p>
    </header>

    <form id="quiz-form">
      <div class="identificacao">
        <div>
          <label for="participantes">Nome do aluno ou nomes do grupo</label>
          <input type="text" id="participantes" name="participantes" placeholder="Ex: Ana, Bruno e Carlos" required />
        </div>
        <div>
          <label for="turma">Turma</label>
          <input type="text" id="turma" name="turma" placeholder="Ex: 7º Ano B" required />
        </div>
      </div>

      <div class="erro-msg" id="erro-msg"></div>

      <div id="perguntas-container">
        <p class="carregando">Carregando perguntas...</p>
      </div>

      <button type="submit" id="btn-enviar">Enviar respostas</button>
    </form>

    <div id="resultado"></div>

    <footer>
      <a href="admin.html">Área do professor</a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
